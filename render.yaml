version: "1"

databases:
  - name: auctioncraze-db
    databaseName: auctioncraze_db
    user: auctioncraze
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: singapore
    ipAllowList: []

services:
  - type: keyvalue
    name: auctioncraze-redis
    plan: 256mb
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: pserv
    name: auctioncraze-ml
    runtime: python
    rootDir: services/ml
    plan: starter # Benchmark RSS under load; upgrade to standard (2 GB RAM) if ML match/audit spikes approach 512 MB
    numInstances: 1
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: INTERNAL_ML_SERVICE_KEY
        generateValue: true

  - type: web
    name: auctioncraze-api
    runtime: node
    plan: starter # Must remain always-on (never free); upgrade to standard for heavy concurrent production traffic
    numInstances: 1
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace=@auctioncraze/shared && npm run build --workspace=@auctioncraze/database && npm run build --workspace=@auctioncraze/auction-engine && npm run build --workspace=@auctioncraze/api
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start --workspace=@auctioncraze/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GUEST_SESSION_TTL_SECONDS
        value: "604800"
      - key: CORS_ORIGIN
        sync: false # Set to comma-separated HTTPS frontend origins (e.g. https://your-site.netlify.app)
      - key: DATABASE_URL
        fromDatabase:
          name: auctioncraze-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: auctioncraze-redis
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: pserv
          name: auctioncraze-ml
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_ML_SERVICE_KEY
        fromService:
          type: pserv
          name: auctioncraze-ml
          envVarKey: INTERNAL_ML_SERVICE_KEY
