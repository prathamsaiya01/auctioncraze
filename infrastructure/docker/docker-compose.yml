name: auctioncraze

services:
  postgres:
    image: postgres:16-alpine
    container_name: auctioncraze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auctioncraze
      POSTGRES_PASSWORD: auctioncraze_dev_password
      POSTGRES_DB: auctioncraze_db
    ports:
      - "5433:5432"
    volumes:
      - auctioncraze_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctioncraze -d auctioncraze_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auctioncraze-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - auctioncraze_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auctioncraze_pgdata:
  auctioncraze_redisdata:
